---
# Obsidian reads the plugin version from manifest.json on the default branch and
# needs an unprefixed tag equal to it, so release-please (not the fleet's tag-only
# cog-bump) keeps a release PR that bumps manifest.json/package.json. Merging it
# tags X.Y.Z and opens a draft release; `publish` attaches the build and only then
# un-drafts it, so Obsidian never sees a version without assets.
name: ci

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
    permissions:
      contents: read
      packages: read
      statuses: write
    with:
      pre-hk: bun install --frozen-lockfile

  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
        with:
          apt-packages: xvfb herbstluftwm

      - run: bun install --frozen-lockfile

      # Obsidian needs a display and a window manager.
      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1

            # The oldest stable Obsidian at or above manifest.json's minAppVersion (1.15.1), and the latest.
      - run: bun run test:e2e
        env:
          WDIO_MAX_INSTANCES: 1
          OBSIDIAN_VERSIONS: "1.15.1/earliest latest/latest"

  ci-gate:
    if: always()
    needs: [hk, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release-please:
    needs: ci-gate
    if: github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An app token, not GITHUB_TOKEN, so the release PR triggers the required CI checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run lint
          bun run build

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" main.js manifest.json styles.css
          gh release edit "$TAG" --draft=false --latest
